# Local stack-validation environment, not a production deployment.
services:
  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    command: ["-listen", "0.0.0.0:8080"]
    environment: &api-environment
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD}
      AUTH_ORIGIN: ${AUTH_ORIGIN:-http://localhost:5173}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY to exactly 64 hex characters}
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: logice
      PGDATABASE: logice
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/api/healthz"]
      interval: 2s
      timeout: 5s
      retries: 15
    mem_limit: 128m

  migrate:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    command: ["migrate"]
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    mem_limit: 128m

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ && wget -q -O /dev/null http://127.0.0.1:8080/api/healthz"]
      interval: 2s
      timeout: 5s
      retries: 15
    mem_limit: 128m

  postgres:
    image: postgres:18.6-alpine3.23@sha256:885cf05d376c7cf27afef02073e6bdac3841252537f16e244fd1c1e6a7c99fb1
    environment:
      POSTGRES_USER: logice
      POSTGRES_DB: logice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1::5432"
    volumes:
      # PostgreSQL 18 stores versioned cluster directories under this path.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    mem_limit: 256m

  clickhouse:
    image: clickhouse/clickhouse-server:26.8.30.8@sha256:4c520c82c14c817f40107fbe90547a43200bf293fe2a99ce7d7d89e528004f92
    environment:
      CLICKHOUSE_USER: logice
      CLICKHOUSE_DB: logice
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD}
    ports:
      - "127.0.0.1::9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./deploy/clickhouse.xml:/etc/clickhouse-server/config.d/logice.xml:ro
    healthcheck:
      test:
        - CMD-SHELL
        - clickhouse-client --user "$$CLICKHOUSE_USER" --password "$$CLICKHOUSE_PASSWORD" --query 'SELECT 1'
      interval: 2s
      timeout: 5s
      retries: 45
      start_period: 20s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    mem_limit: 2g

  collector:
    image: otel/opentelemetry-collector-contrib:0.163.1@sha256:1175b03003053962012f5a231f5567f66a3e8fdb960c7835c0e48f7aa1555806
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD}
      OTLP_TOKEN: ${OTLP_TOKEN:?Set OTLP_TOKEN}
    ports:
      - "127.0.0.1::4317"
      - "127.0.0.1::4318"
      - "127.0.0.1::13133"
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      clickhouse:
        condition: service_healthy
    stop_grace_period: 15s
    mem_limit: 256m

volumes:
  postgres-data:
  clickhouse-data:
