# Local stack-validation environment, not a production deployment.
services:
  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    command: ["-listen", "0.0.0.0:8080"]
    environment: &api-environment
      CLICKHOUSE_ADDR: clickhouse:9000
      COLLECTOR_URL: http://collector:4318
      OTLP_TOKEN: ${OTLP_TOKEN:?Set OTLP_TOKEN}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD}
      AUTH_ORIGIN: ${AUTH_ORIGIN:-http://localhost:5173}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY to exactly 64 hex characters}
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: logice
      PGDATABASE: logice
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/api/healthz"]
      interval: 2s
      timeout: 5s
      retries: 15
    mem_limit: 128m

  migrate:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    command: ["migrate"]
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    mem_limit: 128m

  alerts-worker:
    profiles: ["alerts"]
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    command: ["alerts-worker"]
    environment:
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: logice
      PGDATABASE: logice
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    restart: on-failure
    mem_limit: 128m

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ && wget -q -O /dev/null http://127.0.0.1:8080/api/healthz"]
      interval: 2s
      timeout: 5s
      retries: 15
    mem_limit: 128m

  postgres:
    image: postgres:18.7-alpine3.23@sha256:339a86bf416979bb4d3d2e30a1f9e096e7302564faff4151b804cf53463059d5
    environment:
      POSTGRES_USER: logice
      POSTGRES_DB: logice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1::5432"
    volumes:
      # PostgreSQL 18 stores versioned cluster directories under this path.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h postgres -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    mem_limit: 256m

  clickhouse:
    image: clickhouse/clickhouse-server:26.8.44.3@sha256:4df95084ff95ba95fbe0c512f199b214a738f913fa9e23d2b5e379fffdfa62fc
    environment:
      CLICKHOUSE_USER: logice
      CLICKHOUSE_DB: logice
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD}
    ports:
      - "127.0.0.1::9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./deploy/clickhouse.xml:/etc/clickhouse-server/config.d/logice.xml:ro
    healthcheck:
      test:
        - CMD-SHELL
        - clickhouse-client --host clickhouse --user "$$CLICKHOUSE_USER" --password "$$CLICKHOUSE_PASSWORD" --query 'SELECT 1'
      interval: 2s
      timeout: 5s
      retries: 45
      start_period: 20s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    mem_limit: 2g

  collector:
    image: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD}
      OTLP_TOKEN: ${OTLP_TOKEN:?Set OTLP_TOKEN}
    # Receiver ports are private; application traffic must pass through Go.
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      clickhouse:
        condition: service_healthy
    stop_grace_period: 15s
    mem_limit: 256m

volumes:
  postgres-data:
  clickhouse-data:
