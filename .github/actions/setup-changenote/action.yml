name: Set up changenote
description: Install the reviewed changenote CLI and expose its pinned Action scripts.
outputs:
  action-path:
    description: Absolute path to the pinned changenote source and Action scripts.
    value: ${{ steps.source.outputs.path }}
runs:
  using: composite
  steps:
    - name: Fetch pinned source
      id: source
      shell: bash
      run: |
        source_dir="$RUNNER_TEMP/changenote-source"
        git init "$source_dir"
        git -C "$source_dir" fetch --depth=1 --no-tags https://github.com/narumiruna/changenote \
          f027b7825867044782ae46cc70b01f23e046c5ef
        git -C "$source_dir" checkout --detach FETCH_HEAD
        test "$(git -C "$source_dir" rev-parse HEAD)" = f027b7825867044782ae46cc70b01f23e046c5ef
        echo "path=$source_dir" >> "$GITHUB_OUTPUT"
        echo "CHANGENOTE_ACTION_PATH=$source_dir" >> "$GITHUB_ENV"
    - uses: actions/cache@v5
      id: cli-cache
      with:
        path: ${{ runner.temp }}/changenote/bin
        key: changenote-${{ runner.os }}-${{ runner.arch }}-rust-1.92.0-f027b7825867044782ae46cc70b01f23e046c5ef
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
      if: steps.cli-cache.outputs.cache-hit != 'true'
      with:
        toolchain: 1.92.0
    - name: Install pinned CLI
      if: steps.cli-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        CHANGENOTE_SOURCE: ${{ steps.source.outputs.path }}
      run: cargo install --path "$CHANGENOTE_SOURCE" --locked --root "$RUNNER_TEMP/changenote"
    - name: Verify pinned CLI
      shell: bash
      run: |
        test "$("$RUNNER_TEMP/changenote/bin/changenote" --version)" = 'changenote 0.9.2'
        echo "$RUNNER_TEMP/changenote/bin" >> "$GITHUB_PATH"
