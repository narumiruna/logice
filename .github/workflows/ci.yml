name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  go-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.9
          cache: true
      - run: go mod verify
      - run: sh scripts/check-go.sh

  web-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: test "$(npm --version)" = 11.20.0
      - run: HUSKY=0 npm --prefix web ci
      - run: npm --prefix web run ci
      - run: npm --prefix web audit --audit-level=low

  check-failure-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.9
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: sh scripts/validate-checks.sh

  web-layout-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          cache: npm
          cache-dependency-path: tests/fixtures/web-layout/web/package-lock.json
      - name: Validate isolated frontend dependencies and test layout
        run: ./scripts/validate-web-layout.sh

  stack-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.9
          cache: true
      - name: Validate ingestion and database migrations
        run: go test -tags=integration -count=1 -timeout=8m -v ./tests/integration/...
