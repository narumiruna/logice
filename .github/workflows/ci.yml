name: CI

on:
  workflow_dispatch:
  merge_group:
    types: [checks_requested]
  workflow_call:
    inputs:
      revision:
        description: Exact release commit to validate
        type: string
        required: true
      api-image:
        description: API image reference pinned by digest
        type: string
        required: true
      web-image:
        description: Web image reference pinned by digest
        type: string
        required: true
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  go-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.10
          cache: true
      - run: go mod verify
      - run: sh scripts/check-go.sh
      - name: Check Go vulnerabilities
        run: timeout --kill-after=5s 240 go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -test -tags=integration ./...

  web-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: test "$(npm --version)" = 11.20.0
      - run: HUSKY=0 npm --prefix web ci
      - run: npm --prefix web run ci
      - run: npm --prefix web audit --audit-level=low

  check-failure-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.10
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: sh scripts/validate-checks.sh

  web-layout-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          cache: npm
          cache-dependency-path: tests/fixtures/web-layout/web/package-lock.json
      - name: Validate isolated frontend dependencies and test layout
        run: ./scripts/validate-web-layout.sh

  compose-web-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: HUSKY=0 npm --prefix web ci
      - run: npm --prefix web exec -- playwright install --with-deps chromium
      - uses: docker/login-action@v4
        if: inputs.api-image != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate containerized telemetry workflow
        env:
          API_IMAGE: ${{ inputs.api-image }}
          WEB_IMAGE: ${{ inputs.web-image }}
        run: |
          if [ -n "$API_IMAGE$WEB_IMAGE" ]; then
            timeout --kill-after=60s 600 sh scripts/validate-compose-web.sh "$API_IMAGE" "$WEB_IMAGE"
          else
            timeout --kill-after=60s 600 sh scripts/validate-compose-web.sh
          fi

  helm-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv run charts/logice/tests/check.py

  stack-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.10
          cache: true
      - name: Validate ingestion and database migrations
        run: go test -race -tags=integration -count=1 -timeout=8m -v ./tests/integration/... ./internal/auth/...

  deployment-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv run tests/deployment/check.py
      - name: Validate changed GitOps records against release evidence and current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch origin main
          uv run scripts/deployment.py check --base origin/main

  release-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: test "$(npm --version)" = 11.20.0
      - run: HUSKY=0 npm --prefix web ci --ignore-scripts
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: ./.github/actions/setup-changenote
      - run: uv run tests/release/check.py
      - run: changenote status
