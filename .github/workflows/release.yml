name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      operation:
        description: Manage the release PR or retry the latest validated publication
        type: choice
        default: manage-pr
        options:
          - manage-pr
          - retry-publication

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: test "$(npm --version)" = 11.20.0
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.10
          cache: true
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: ./.github/actions/setup-changenote
      - run: HUSKY=0 npm --prefix web ci
      - run: go mod verify
      - run: sh scripts/check-go.sh
      - run: npm --prefix web run ci
      - run: uv run tests/release/check.py
      - run: changenote status

  release:
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.operation == 'manage-pr')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: HUSKY=0 npm --prefix web ci --ignore-scripts
      - uses: ./.github/actions/setup-changenote
      - name: Create or update the release PR
        uses: narumiruna/changenote@66afe581b2f7b19f96188a1f217518c41aaaf77d # v0.7.0
        with:
          base-branch: main
          commit-message: "chore(release): version Logice"
          pr-title: "chore(release): version Logice"

  publish:
    needs: [validate, release]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.validate.result == 'success' && (github.event_name == 'push' || inputs.operation == 'retry-publication') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: HUSKY=0 npm --prefix web ci --ignore-scripts
      - uses: ./.github/actions/setup-changenote
      - name: Publish or recover the latest validated release batch
        uses: narumiruna/changenote/publish@66afe581b2f7b19f96188a1f217518c41aaaf77d # v0.7.0
        with:
          base-branch: main
