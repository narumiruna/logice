name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      operation:
        description: Manage the release PR or retry the latest validated publication
        type: choice
        default: manage-pr
        options:
          - manage-pr
          - retry-publication

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    outputs:
      publication-commit: ${{ steps.preview.outputs.release-commit }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: test "$(npm --version)" = 11.20.0
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.10
          cache: true
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: ./.github/actions/setup-changenote
      - run: HUSKY=0 npm --prefix web ci
      - run: go mod verify
      - run: sh scripts/check-go.sh
      - run: npm --prefix web run ci
      - run: uv run tests/release/check.py
      - run: changenote status
      - name: Select the publication batch without write permissions
        id: preview
        if: github.event_name == 'push' || inputs.operation == 'retry-publication'
        uses: narumiruna/changenote/preview@66afe581b2f7b19f96188a1f217518c41aaaf77d # v0.7.0
        with:
          base-branch: main
      - name: Require a ready publication selection
        if: steps.preview.outputs.release-commit != ''
        env:
          PREVIEW_READY: ${{ steps.preview.outputs.ready }}
        run: test "$PREVIEW_READY" = true
      - name: Check out the selected release commit
        if: steps.preview.outputs.release-commit != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.preview.outputs.release-commit }}
          path: publication-source
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the exact publication source
        if: steps.preview.outputs.release-commit != ''
        working-directory: publication-source
        env:
          EXPECTED_RELEASE_COMMIT: ${{ steps.preview.outputs.release-commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_RELEASE_COMMIT"
          HUSKY=0 npm --prefix web ci --ignore-scripts
          go mod verify
          sh scripts/check-go.sh
          npm --prefix web run ci
          uv run tests/release/check.py

  release:
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.operation == 'manage-pr')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: HUSKY=0 npm --prefix web ci --ignore-scripts
      - uses: ./.github/actions/setup-changenote
      - name: Create or update the release PR
        uses: narumiruna/changenote@66afe581b2f7b19f96188a1f217518c41aaaf77d # v0.7.0
        with:
          base-branch: main
          commit-message: "chore(release): version Logice"
          pr-title: "chore(release): version Logice"

  publish:
    needs: [validate, release]
    outputs:
      release-commit: ${{ steps.publish.outputs.release-commit }}
      published: ${{ steps.publish.outputs.published }}
      image-tag: ${{ steps.image.outputs.tag }}
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.validate.result == 'success' && needs.validate.outputs.publication-commit != '' && (github.event_name == 'push' || inputs.operation == 'retry-publication') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.publication-commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: HUSKY=0 npm --prefix web ci --ignore-scripts
      - uses: ./.github/actions/setup-changenote
        id: changenote
      - name: Publish only the validated release batch
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_BASE_BRANCH: main
          CHANGENOTE_SOURCE: ${{ steps.changenote.outputs.action-path }}
          EXPECTED_RELEASE_COMMIT: ${{ needs.validate.outputs.publication-commit }}
        run: bash "$CHANGENOTE_SOURCE/scripts/action/publish.sh" "$EXPECTED_RELEASE_COMMIT"
      - name: Set release image tag
        id: image
        if: steps.publish.outputs.release-commit != ''
        env:
          RELEASE_COMMIT: ${{ steps.publish.outputs.release-commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          IFS= read -r version < VERSION
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  docker:
    needs: publish
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.publish.result == 'success' && needs.publish.outputs.release-commit != '' && (needs.publish.outputs.published == 'true' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'retry-publication')) }}
    permissions:
      contents: read
      packages: write
      actions: read
    uses: ./.github/workflows/docker.yml
    with:
      revision: ${{ needs.publish.outputs.release-commit }}
      version-tag: ${{ needs.publish.outputs.image-tag }}
