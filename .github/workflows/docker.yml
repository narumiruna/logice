name: Docker

on:
  workflow_call:
    inputs:
      revision:
        description: Validated source commit to build
        type: string
        required: true
      version-tag:
        description: Stable release tag, such as v1.2.3
        type: string
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.component }} image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [api, web]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Set image tags
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          COMPONENT: ${{ matrix.component }}
          EXPECTED_REVISION: ${{ inputs.revision }}
          VERSION_TAG: ${{ inputs.version-tag }}
        run: |
          set -euo pipefail
          revision=$(git rev-parse HEAD)
          [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ && "$revision" == "$EXPECTED_REVISION" ]] || {
            echo 'A release build requires the exact validated commit.' >&2
            exit 1
          }
          if [[ ${#VERSION_TAG} -gt 128 || ! "$VERSION_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Use a stable v<major>.<minor>.<patch> tag of at most 128 characters.' >&2
            exit 1
          fi
          IFS= read -r version < VERSION
          test "$VERSION_TAG" = "v$version"
          repository=$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          name="ghcr.io/${repository}-${COMPONENT}"
          {
            echo "name=$name"
            echo "revision=$revision"
            echo 'tags<<IMAGE_TAGS'
            echo "$name:$revision"
            echo "$name:$VERSION_TAG"
            echo 'IMAGE_TAGS'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/${{ matrix.component }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Record the published index digest
        env:
          COMPONENT: ${{ matrix.component }}
          REVISION: ${{ steps.image.outputs.revision }}
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: jq -n --arg component "$COMPONENT" --arg revision "$REVISION" --arg image "$IMAGE" '{component:$component,revision:$revision,image:$image}' > "$COMPONENT.json"
      - uses: actions/upload-artifact@v7
        with:
          name: logice-image-${{ github.run_attempt }}-${{ matrix.component }}
          path: ${{ matrix.component }}.json
          if-no-files-found: error
          retention-days: 30

  validate-images:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: HUSKY=0 npm --prefix web ci
      - run: npm --prefix web exec -- playwright install --with-deps chromium
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          pattern: logice-image-${{ github.run_attempt }}-*
          path: image-records
          merge-multiple: true
      - name: Read the complete image pair
        id: pair
        env:
          REVISION: ${{ inputs.revision }}
        run: uv run scripts/deployment.py pair image-records "$REVISION"
      - name: Validate the published image pair
        env:
          API_IMAGE: ${{ steps.pair.outputs.api }}
          WEB_IMAGE: ${{ steps.pair.outputs.web }}
        run: timeout --kill-after=60s 600 sh scripts/validate-compose-web.sh "$API_IMAGE" "$WEB_IMAGE"
      - name: Record the tested deployment candidate
        env:
          REVISION: ${{ inputs.revision }}
          VERSION: ${{ inputs.version-tag }}
          API_IMAGE: ${{ steps.pair.outputs.api }}
          WEB_IMAGE: ${{ steps.pair.outputs.web }}
        run: uv run scripts/deployment.py candidate --revision "$REVISION" --version "$VERSION" --api-image "$API_IMAGE" --web-image "$WEB_IMAGE" --output candidate.json
      - uses: actions/upload-artifact@v7
        with:
          name: logice-deployment-${{ github.run_attempt }}
          path: candidate.json
          if-no-files-found: error
          retention-days: 30
