name: Docker

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        description: Validated source commit to build
        type: string
        required: true
      version-tag:
        description: Stable release tag, such as v1.2.3
        type: string
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.component }} image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [api, web]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - name: Set image tags
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          COMPONENT: ${{ matrix.component }}
          REF: ${{ github.ref }}
          # Reusable workflows keep the caller event name. Inspect the call input instead.
          CALLED: ${{ contains(toJSON(inputs), '"revision"') }}
          EXPECTED_REVISION: ${{ inputs.revision }}
          VERSION_TAG: ${{ inputs.version-tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          set -euo pipefail
          revision=$(git rev-parse HEAD)
          if [[ "$CALLED" == true ]]; then
            [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ && "$revision" == "$EXPECTED_REVISION" && -n "$VERSION_TAG" ]] || {
              echo 'A reusable build requires an exact commit and a version tag.' >&2
              exit 1
            }
          fi
          if [[ -n "$VERSION_TAG" && ( ${#VERSION_TAG} -gt 128 || ! "$VERSION_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ) ]]; then
            echo 'Use a stable v<major>.<minor>.<patch> tag of at most 128 characters.' >&2
            exit 1
          fi
          repository=$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          name="ghcr.io/${repository}-${COMPONENT}"
          {
            echo "name=$name"
            echo "revision=$revision"
            echo 'tags<<IMAGE_TAGS'
            echo "$name:$revision"
            if [[ -n "$VERSION_TAG" ]]; then echo "$name:$VERSION_TAG"; fi
            if [[ "$CALLED" != true && "$REF" == refs/heads/main ]]; then echo "$name:latest"; fi
            echo 'IMAGE_TAGS'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/${{ matrix.component }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
