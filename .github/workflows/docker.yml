name: Docker

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        description: Validated source commit to build
        type: string
        required: true
      version-tag:
        description: Stable release tag, such as v1.2.3
        type: string
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.component }} image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [api, web]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - name: Set image tags
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          COMPONENT: ${{ matrix.component }}
          REF: ${{ github.ref }}
          # Reusable workflows keep the caller event name. Inspect the call input instead.
          CALLED: ${{ contains(toJSON(inputs), '"revision"') }}
          EXPECTED_REVISION: ${{ inputs.revision }}
          VERSION_TAG: ${{ inputs.version-tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          set -euo pipefail
          revision=$(git rev-parse HEAD)
          if [[ "$CALLED" == true ]]; then
            [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ && "$revision" == "$EXPECTED_REVISION" && -n "$VERSION_TAG" ]] || {
              echo 'A reusable build requires an exact commit and a version tag.' >&2
              exit 1
            }
          fi
          if [[ -n "$VERSION_TAG" && ( ${#VERSION_TAG} -gt 128 || ! "$VERSION_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ) ]]; then
            echo 'Use a stable v<major>.<minor>.<patch> tag of at most 128 characters.' >&2
            exit 1
          fi
          repository=$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          name="ghcr.io/${repository}-${COMPONENT}"
          {
            echo "name=$name"
            echo "revision=$revision"
            echo 'tags<<IMAGE_TAGS'
            echo "$name:$revision"
            if [[ -n "$VERSION_TAG" ]]; then echo "$name:$VERSION_TAG"; fi
            if [[ "$CALLED" != true && "$REF" == refs/heads/main ]]; then echo "$name:latest"; fi
            echo 'IMAGE_TAGS'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/${{ matrix.component }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Record the published index digest
        if: inputs.revision != ''
        env:
          COMPONENT: ${{ matrix.component }}
          REVISION: ${{ steps.image.outputs.revision }}
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: jq -n --arg component "$COMPONENT" --arg revision "$REVISION" --arg image "$IMAGE" '{component:$component,revision:$revision,image:$image}' > "$COMPONENT.json"
      - uses: actions/upload-artifact@v7
        if: inputs.revision != ''
        with:
          name: logice-image-${{ github.run_attempt }}-${{ matrix.component }}
          path: ${{ matrix.component }}.json
          if-no-files-found: error
          retention-days: 30

  pair:
    if: inputs.revision != ''
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.pair.outputs.api }}
      web: ${{ steps.pair.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: actions/download-artifact@v8
        with:
          pattern: logice-image-${{ github.run_attempt }}-*
          path: image-records
          merge-multiple: true
      - id: pair
        env:
          REVISION: ${{ inputs.revision }}
        run: uv run scripts/deployment.py pair image-records "$REVISION"

  validate-images:
    needs: pair
    permissions:
      contents: read
      actions: read
      packages: read
    uses: ./.github/workflows/ci.yml
    with:
      revision: ${{ inputs.revision }}
      api-image: ${{ needs.pair.outputs.api }}
      web-image: ${{ needs.pair.outputs.web }}

  candidate:
    needs: [pair, validate-images]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Record the fully validated deployment candidate
        env:
          REVISION: ${{ inputs.revision }}
          VERSION: ${{ inputs.version-tag }}
          API_IMAGE: ${{ needs.pair.outputs.api }}
          WEB_IMAGE: ${{ needs.pair.outputs.web }}
        run: uv run scripts/deployment.py candidate --revision "$REVISION" --version "$VERSION" --api-image "$API_IMAGE" --web-image "$WEB_IMAGE" --output candidate.json
      - uses: actions/upload-artifact@v7
        with:
          name: logice-deployment-${{ github.run_attempt }}
          path: candidate.json
          if-no-files-found: error
          retention-days: 30
