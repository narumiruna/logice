{{- range $component, $ports := dict "api" (list (dict "name" "http" "port" 8080)) "web" (list (dict "name" "http" "port" 8080)) "clickhouse" (list (dict "name" "native" "port" 9000)) "collector" (list (dict "name" "otlp-grpc" "port" 4317) (dict "name" "otlp-http" "port" 4318)) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "logice.name" $ }}-{{ $component }}
  labels:
    {{- include "logice.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: logice
    app.kubernetes.io/instance: {{ $.Release.Name | quote }}
    app.kubernetes.io/component: {{ $component }}
  ports:
    {{- range $ports }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .name }}
    {{- end }}
{{- end }}
