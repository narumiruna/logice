{{- range $component, $ports := dict "postgres" (list (dict "name" "postgres" "port" 5432)) "api" (list (dict "name" "http" "port" 8080)) "web" (list (dict "name" "http" "port" 8080)) "clickhouse" (list (dict "name" "native" "port" 9000)) "collector" (list (dict "name" "otlp-grpc" "port" 4317) (dict "name" "otlp-http" "port" 4318)) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ if eq $component "web" }}logice-tunnel{{ else }}{{ include "logice.name" $ }}-{{ $component }}{{ end }}
  labels:
    {{- include "logice.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  type: {{ if eq $component "web" }}{{ $.Values.web.service.type }}{{ else }}ClusterIP{{ end }}
  selector:
    app.kubernetes.io/name: logice
    app.kubernetes.io/instance: {{ $.Release.Name | quote }}
    app.kubernetes.io/component: {{ $component }}
  ports:
    {{- range $ports }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .name }}
      {{- if and (eq $component "web") (eq $.Values.web.service.type "NodePort") }}
      nodePort: {{ $.Values.web.service.nodePort }}
      {{- end }}
    {{- end }}
{{- end }}
