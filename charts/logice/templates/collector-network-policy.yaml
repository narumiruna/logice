apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "logice.name" . }}-collector
  labels:
    {{- include "logice.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: logice
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
      app.kubernetes.io/component: collector
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: logice
              app.kubernetes.io/instance: {{ .Release.Name | quote }}
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 4318
