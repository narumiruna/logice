apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "logice.name" . }}-api
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "logice.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: logice
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: logice
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: migrate
          image: {{ include "logice.image" (dict "name" "api" "image" .Values.api.image) | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          args: ["migrate"]
          securityContext:
            {{- include "logice.apiSecurityContext" . | nindent 12 }}
          env:
            {{- include "logice.apiEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      containers:
        - name: api
          image: {{ include "logice.image" (dict "name" "api" "image" .Values.api.image) | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          args: ["-listen", "0.0.0.0:8080"]
          securityContext:
            {{- include "logice.apiSecurityContext" . | nindent 12 }}
          env:
            {{- include "logice.apiEnv" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              # Keep tag-only legacy installs compatible until digest promotion.
              path: {{ ternary "/api/readyz" "/api/healthz" (not (empty .Values.api.image.digest)) }}
              port: http
            periodSeconds: 5
            {{- if .Values.api.image.digest }}
            timeoutSeconds: 3
            {{- end }}
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
