apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "logice.name" . }}-postgres
  labels:
    {{- include "logice.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  {{- if ne .Values.postgres.persistence.storageClass nil }}
  storageClassName: {{ .Values.postgres.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgres.persistence.size | quote }}
