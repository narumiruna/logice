# Use the latest images published from main.
# Restart API/web deployments after publishing to pull updated images.
# Private packages require a namespace-local imagePullSecret.
api:
  image:
    repository: ghcr.io/narumiruna/logice-api
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      memory: 128Mi

web:
  # The UI and query API have no authentication. Restrict node network access.
  service:
    type: NodePort
    nodePort: 30173
  image:
    repository: ghcr.io/narumiruna/logice-web
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      memory: 128Mi

imagePullSecrets: []
# - name: registry-credentials

# Pre-create this Secret in the release namespace. No credentials are generated.
# Required keys: CLICKHOUSE_PASSWORD and OTLP_TOKEN.
existingSecret: logice-secrets

clickhouse:
  image: clickhouse/clickhouse-server:26.8.30.8@sha256:4c520c82c14c817f40107fbe90547a43200bf293fe2a99ce7d7d89e528004f92
  persistence:
    size: 20Gi
    # null uses the cluster default; "" requests no storage class.
    storageClass: null
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi

collector:
  image: otel/opentelemetry-collector-contrib:0.163.1@sha256:1175b03003053962012f5a231f5567f66a3e8fdb960c7835c0e48f7aa1555806
  # Exporter-managed tables; telemetry expires after 24 hours.
  ttl: 24h
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

# Ingress is off. Web is already exposed through NodePort by default.
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tls: []
