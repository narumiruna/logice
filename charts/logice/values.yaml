# Defaults support local rendering. For GitOps, promote a tested API/web digest pair.
# Changing a registry tag does not trigger an Argo CD rollout.
# Private packages require a namespace-local imagePullSecret.
api:
  authOrigin: https://logice.narumi.dev
  image:
    repository: ghcr.io/narumiruna/logice-api
    digest: "" # sha256:<64 hex>; overrides tag when set
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      memory: 128Mi

# A separate worker; enable only after migration, key backup, and egress validation.
alertsWorker:
  enabled: false

web:
  # Restrict node access: NodePort can bypass Cloudflare Access.
  service:
    type: NodePort
    nodePort: 30173
  image:
    repository: ghcr.io/narumiruna/logice-web
    digest: "" # sha256:<64 hex>; overrides tag when set
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      memory: 128Mi

imagePullSecrets: []
# - name: registry-credentials

# Pre-create this Secret in the release namespace. No credentials are generated.
# OTLP_TOKEN is internal-only; applications use project tokens through Go.
# Required keys: CLICKHOUSE_PASSWORD, OTLP_TOKEN, POSTGRES_PASSWORD,
# ENCRYPTION_KEY (exactly 64 hex characters).
existingSecret: logice-secrets

postgres:
  image: postgres:18.7-alpine3.23@sha256:339a86bf416979bb4d3d2e30a1f9e096e7302564faff4151b804cf53463059d5
  persistence:
    size: 5Gi
    storageClass: null
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

clickhouse:
  image: clickhouse/clickhouse-server:26.8.44.3@sha256:4df95084ff95ba95fbe0c512f199b214a738f913fa9e23d2b5e379fffdfa62fc
  persistence:
    size: 20Gi
    # null uses the cluster default; "" requests no storage class.
    storageClass: null
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi

collector:
  image: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
  # Exporter-managed tables; telemetry expires after 24 hours.
  ttl: 24h
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

# Ingress is off. Web is already exposed through NodePort by default.
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tls: []
