# Private receiver: only the authenticated Go proxy sets project metadata.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  bearertokenauth:
    token: ${env:OTLP_TOKEN}

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        include_metadata: true
        max_recv_msg_size_mib: 8
        auth:
          authenticator: bearertokenauth
      http:
        endpoint: 0.0.0.0:4318
        include_metadata: true
        max_request_body_size: 8388608
        auth:
          authenticator: bearertokenauth

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  # Remove all duplicate reserved keys, not just the first protobuf map entry.
  transform/project:
    error_mode: propagate
    trace_statements:
      - context: resource
        statements:
          - 'delete_matching_keys(attributes, "^logice[.]project[.]id$")'
      - context: span
        statements:
          - 'delete_matching_keys(attributes, "^logice[.]project[.]id$")'
    log_statements:
      - context: resource
        statements:
          - 'delete_matching_keys(attributes, "^logice[.]project[.]id$")'
      - context: log
        statements:
          - 'delete_matching_keys(attributes, "^logice[.]project[.]id$")'
  resource/project:
    attributes:
      - key: logice.project.id
        action: delete
      - key: logice.project.id
        action: insert
        from_context: metadata.x-logice-project-id
  filter/project:
    error_mode: propagate
    traces:
      span:
        - 'resource.attributes["logice.project.id"] == nil or resource.attributes["logice.project.id"] == ""'
    logs:
      log_record:
        - 'resource.attributes["logice.project.id"] == nil or resource.attributes["logice.project.id"] == ""'
  attributes/project:
    actions:
      - key: logice.project.id
        action: delete

exporters:
  clickhouse:
    endpoint: tcp://clickhouse:9000
    database: logice
    username: logice
    password: ${env:CLICKHOUSE_PASSWORD}
    # Exporter-managed schemas are only for the disposable validation environment.
    create_schema: true
    ttl: 24h
    async_insert: false
    timeout: 5s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 100
      batch:
        min_size: 512
        max_size: 2048
        flush_timeout: 1s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 300s

service:
  extensions: [health_check, bearertokenauth]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/project, resource/project, filter/project, attributes/project]
      exporters: [clickhouse]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, transform/project, resource/project, filter/project, attributes/project]
      exporters: [clickhouse]
