resolver 127.0.0.11 valid=5s ipv6=off;

upstream logice_api {
    zone logice_api 64k;
    server api:8080 resolve;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /api {
        proxy_pass http://logice_api;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://logice_api;
        proxy_set_header Host $host;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
